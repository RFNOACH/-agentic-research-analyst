[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "agentic-research-analyst"
version = "0.3.1"
description = "Multi-tool LLM agent that plans, searches, reads PDFs, runs code, and drafts cited research memos."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "RFNOACH" }]
keywords = ["langgraph", "agent", "research", "llm", "evaluation", "tool-use"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "tavily-python>=0.4.0",
    "pymupdf>=1.24.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "typer[all]>=0.12.0",
    "rich>=13.8.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
eval = ["numpy>=1.26.0", "pandas>=2.2.0", "tabulate>=0.9.0", "scipy>=1.14.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
research-agent = "src.cli:app"

[project.urls]
Repository = "https://github.com/RFNOACH/agentic-research-analyst"
Documentation = "https://github.com/RFNOACH/agentic-research-analyst/tree/main/docs"
Issues = "https://github.com/RFNOACH/agentic-research-analyst/issues"

# ── Ruff ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

# ── Pytest ───────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]

# ── Mypy ─────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
